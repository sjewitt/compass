services:
  web:
    build: .
    ports:
     - "8080:8080"
     - "5678:5678"

    # pass in user:group from startup arg:
    # - $uid(id -u ${USER}) $gid(id -g ${USER}) docker compose up
    user: ${uid}:${gid}

    # specify .env file:
    # see https://docs.docker.com/compose/how-tos/environment-variables/set-environment-variables/
    env_file:
      - .env  

    volumes:
     - type: bind
       source: ./database
       target: /code/database
     - type: bind
       source: .
       target: /code 